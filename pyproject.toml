[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blacksmith_project"
version = "0.1.0"
description = "Minimal message processing API service"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Blacksmith Team"}
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.25.0",
    "pytest>=7.0",
]

[project.scripts]
blacksmith-service = "blacksmith_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "*.egg-info", ".venv"]